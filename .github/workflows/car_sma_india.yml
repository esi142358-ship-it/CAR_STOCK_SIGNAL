name: CAR + SMA Daily Scanner (India Only)

on:
  # India scan — 4:30 PM IST = 11:00 UTC
  schedule:
    - cron: '0 11 * * 1-5'    # Mon-Fri 4:30 PM IST

  workflow_dispatch:

jobs:
  india_scan:
    name: "India — CAR + SMA Scanner"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: car_strategy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pandas numpy gspread oauth2client openpyxl

      - name: Run Stock Picker
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          python3 - << 'PYEOF'
          import pandas as pd, os, json, gspread, numpy as np
          from oauth2client.service_account import ServiceAccountCredentials

          def clean_dataframe(df: pd.DataFrame) -> pd.DataFrame:
              def clean_value(x):
                  try:
                      if pd.isna(x) or x in [np.inf, -np.inf]:
                          return ""
                  except Exception:
                      pass
                  return x
              return df.applymap(clean_value)

          # Load India stock picker output
          if not os.path.exists("stock_picker_report.xlsx"):
              raise FileNotFoundError("⚠️ stock_picker_report.xlsx not found")

          df = pd.read_excel("stock_picker_report.xlsx")

          # Add Volume column if not already present
          if "Volume" not in df.columns:
              df["Volume"] = None

          # Clean before saving
          df = clean_dataframe(df)

          # Save single consolidated report
          os.makedirs("aircraft", exist_ok=True)
          df.to_excel("aircraft/India_Final_Report.xlsx", index=False)

          # Push to Google Sheet
          creds_json = os.environ.get('GCP_CREDENTIALS')
          creds_dict = json.loads(creds_json)
          scope = ["https://spreadsheets.google.com/feeds","https://www.googleapis.com/auth/drive"]
          creds = ServiceAccountCredentials.from_json_keyfile_dict(creds_dict, scope)
          client = gspread.authorize(creds)

          spreadsheet_id = "1bkwZz3tuclh_Iux_l56HpwEiYbekCNLug_4U2h_xjOM"
          try:
              ws_final = client.open_by_key(spreadsheet_id).worksheet("final")
          except:
              ws_final = client.open_by_key(spreadsheet_id).add_worksheet(title="final", rows="300", cols="10")

          ws_final.clear()
          ws_final.update([df.columns.values.tolist()] + df.values.tolist())
          print("✅ Final report saved to aircraft and Google Sheet")
          PYEOF
