name: CAR + SMA Daily Scanner (India Only)

on:
  schedule:
    - cron: '0 11 * * 1-5'    # Mon-Fri 4:30 PM IST
  workflow_dispatch:

jobs:
  india_scan:
    name: "India — CAR + SMA Scanner"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: car_strategy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas openpyxl requests python-dateutil gspread oauth2client matplotlib

      - name: Run India CAR Scanner
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: python stock_signal_scanner.py

      - name: Run India SMA Filter
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: python sma_filter.py

      - name: Run India Stock Picker
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: python stock_picker.py

      - name: Save Multi-Sheet SMA Report
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          python3 - << 'PYEOF'
          import pandas as pd, os, json, gspread, numpy as np
          from oauth2client.service_account import ServiceAccountCredentials

          # Load SMA filter output
          df = pd.read_excel("sma_filter_report.xlsx")

          # Split into categories
          sweet_spot = df[df['Sweet Spot'] == 'YES']
          failed = df[df['Sweet Spot'] == 'NO']

          summary = pd.DataFrame({
              "Category": ["Sweet Spot", "Failed"],
              "Count": [len(sweet_spot), len(failed)]
          })

          # Save multi-sheet Excel
          os.makedirs("aircraft", exist_ok=True)
          with pd.ExcelWriter("aircraft/India_SMA_Report.xlsx", engine="openpyxl") as writer:
              df.to_excel(writer, sheet_name="All CAR + SMA", index=False)
              sweet_spot.to_excel(writer, sheet_name="SMA Sweet Spot", index=False)
              failed.to_excel(writer, sheet_name="Failed SMA Filter", index=False)
              summary.to_excel(writer, sheet_name="Summary Dashboard", index=False)

          # Push to Google Sheet
          creds_dict = json.loads(os.environ['GCP_CREDENTIALS'])
          scope = ["https://spreadsheets.google.com/feeds","https://www.googleapis.com/auth/drive"]
          creds = ServiceAccountCredentials.from_json_keyfile_dict(creds_dict, scope)
          client = gspread.authorize(creds)

          spreadsheet_id = "YOUR_SHEET_ID"

          for sheet_name, data in {
              "All CAR + SMA": df,
              "SMA Sweet Spot": sweet_spot,
              "Failed SMA Filter": failed,
              "Summary Dashboard": summary
          }.items():
              try:
                  ws = client.open_by_key(spreadsheet_id).worksheet(sheet_name)
              except:
                  ws = client.open_by_key(spreadsheet_id).add_worksheet(title=sheet_name, rows="500", cols="20")
              ws.clear()
              ws.update([list(data.columns)] + data.astype(str).values.tolist())

          print("✅ Multi-sheet SMA report saved to aircraft and Google Sheet")
          PYEOF

      - name: Upload SMA Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: INDIA_SMA_REPORT_${{ github.run_number }}
          path: aircraft/India_SMA_Report.xlsx
          retention-days: 30
