name: CAR + SMA Daily Scanner (India Only)

on:
  schedule:
    - cron: '0 11 * * 1-5'    # Mon-Fri 4:30 PM IST
  workflow_dispatch:

jobs:
  india_scan:
    name: "India — CAR + SMA Scanner"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: car_strategy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance>=0.2.40 pandas openpyxl requests python-dateutil gspread oauth2client google-api-python-client

      - name: Run India CAR Scanner
        run: python stock_signal_scanner.py

      - name: Run India SMA Filter
        run: python sma_filter.py

      - name: Run India Stock Picker
        run: python stock_picker.py

      - name: Upload All India Reports
        uses: actions/upload-artifact@v4
        with:
          name: INDIA_ALL_REPORTS_${{ github.run_number }}
          path: |
            car_strategy/buy_signals_report.xlsx
            car_strategy/sma_filter_report.xlsx
            car_strategy/stock_picker_report.xlsx
          retention-days: 30

      - name: Push Full SMA Filter Workbook to Google Sheet
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          python3 - << 'PYEOF'
          import pandas as pd, json, gspread
          from oauth2client.service_account import ServiceAccountCredentials
          from googleapiclient.discovery import build

          # Load Excel workbook
          xls = pd.ExcelFile("sma_filter_report.xlsx")

          # Authorize
          creds_dict = json.loads(os.environ['GCP_CREDENTIALS'])
          scope = ["https://www.googleapis.com/auth/spreadsheets"]
          creds = ServiceAccountCredentials.from_json_keyfile_dict(creds_dict, scope)
          client = gspread.authorize(creds)
          service = build('sheets', 'v4', credentials=creds)

          spreadsheet_id = "1bkwZz3tuclh_Iux_l56HpwEiYbekCNLug_4U2h_xjOM"
          spreadsheet = client.open_by_key(spreadsheet_id)

          for sheet_name in xls.sheet_names:
              df = pd.read_excel(xls, sheet_name=sheet_name)
              try:
                  ws = spreadsheet.worksheet(sheet_name)
              except:
                  ws = spreadsheet.add_worksheet(title=sheet_name, rows="1000", cols="20")
              ws.clear()
              ws.update([list(df.columns)] + df.astype(str).values.tolist())

              # Apply formatting: header row bold + background
              requests = [
                  {
                      "repeatCell": {
                          "range": {
                              "sheetId": ws.id,
                              "startRowIndex": 0,
                              "endRowIndex": 1
                          },
                          "cell": {
                              "userEnteredFormat": {
                                  "backgroundColor": {"red": 0.12, "green": 0.30, "blue": 0.79},
                                  "textFormat": {"bold": True, "foregroundColor": {"red": 1, "green": 1, "blue": 1}}
                              }
                          },
                          "fields": "userEnteredFormat(backgroundColor,textFormat)"
                      }
                  }
              ]
              service.spreadsheets().batchUpdate(
                  spreadsheetId=spreadsheet_id,
                  body={"requests": requests}
              ).execute()

          print("✅ Full SMA Filter workbook duplicated with formatting in Google Sheet")
          PYEOF
