name: CAR + SMA Daily Scanner (India Only)

on:
  schedule:
    - cron: '0 11 * * 1-5'    # Mon-Fri 4:30 PM IST
  workflow_dispatch:

jobs:
  india_scan:
    name: "India — CAR + SMA Scanner"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: car_strategy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance>=0.2.40 pandas openpyxl requests python-dateutil gspread oauth2client

      - name: Run India CAR Scanner
        run: python stock_signal_scanner.py

      - name: Run India SMA Filter
        run: python sma_filter.py

      - name: Run India Stock Picker
        run: python stock_picker.py

      - name: Show India Summary
        run: |
          python3 - << 'PYEOF'
          import os
          reports = [
              ("buy_signals_report.xlsx",  "India CAR Signals"),
              ("sma_filter_report.xlsx",   "India SMA Filter"),
              ("stock_picker_report.xlsx", "India Stock Picker"),
          ]
          for fname, label in reports:
              if os.path.exists(fname):
                  print(f"✅ {label:<25} {fname}")
              else:
                  print(f"❌ {label:<25} {fname}")
          PYEOF

      - name: Upload All India Reports
        uses: actions/upload-artifact@v4
        with:
          name: INDIA_ALL_REPORTS_${{ github.run_number }}
          path: |
            car_strategy/buy_signals_report.xlsx
            car_strategy/sma_filter_report.xlsx
            car_strategy/stock_picker_report.xlsx
          retention-days: 30

      - name: Push SMA Filter to Google Sheet
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          python3 - << 'PYEOF'
          import pandas as pd, os, json, gspread
          from oauth2client.service_account import ServiceAccountCredentials

          # Load SMA filter report
          df = pd.read_excel("sma_filter_report.xlsx")

          # Remove CAR Day columns (not needed in Google Sheet)
          drop_cols = [c for c in df.columns if "CAR Day" in c]
          df = df.drop(columns=drop_cols, errors="ignore")

          # Authorize Google Sheets
          creds_dict = json.loads(os.environ['GCP_CREDENTIALS'])
          scope = ["https://spreadsheets.google.com/feeds","https://www.googleapis.com/auth/drive"]
          creds = ServiceAccountCredentials.from_json_keyfile_dict(creds_dict, scope)
          client = gspread.authorize(creds)

          spreadsheet_id = "1bkwZz3tuclh_Iux_l56HpwEiYbekCNLug_4U2h_xjOM"
          try:
              ws = client.open_by_key(spreadsheet_id).worksheet("India SMA Filter")
          except:
              ws = client.open_by_key(spreadsheet_id).add_worksheet(title="India SMA Filter", rows="1000", cols="20")

          ws.clear()
          ws.update([list(df.columns)] + df.astype(str).values.tolist())
          print("✅ SMA Filter report pushed to Google Sheet (India SMA Filter)")
          PYEOF
