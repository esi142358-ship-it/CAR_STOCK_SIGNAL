name: CAR + SMA Daily Scanner (India1 Only)

on:
  schedule:
    - cron: '0 11 * * 1-5'    # Mon-Fri 4:30 PM IST
  workflow_dispatch:

jobs:
  india_scan:
    name: "India — CAR + SMA Scanner"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: car_strategy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance>=0.2.40 pandas openpyxl requests python-dateutil gspread oauth2client google-api-python-client numpy

      - name: Run India CAR Scanner
        run: python stock_signal_scanner.py

      - name: Run India SMA Filter
        run: python sma_filter.py

      - name: Run India Stock Picker
        run: python stock_picker.py

      - name: Upload All India Reports
        uses: actions/upload-artifact@v4
        with:
          name: INDIA_ALL_REPORTS_${{ github.run_number }}
          path: |
            car_strategy/buy_signals_report.xlsx
            car_strategy/sma_filter_report.xlsx
            car_strategy/stock_picker_report.xlsx
          retention-days: 30

      - name: Push Full SMA Filter Workbook to Google Sheet (with Colours)
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          python3 - << 'PYEOF'
          import os, pandas as pd, json, gspread, numpy as np
          from oauth2client.service_account import ServiceAccountCredentials
          from googleapiclient.discovery import build

          # Load Excel workbook
          xls = pd.ExcelFile("sma_filter_report.xlsx")

          # Authorize
          creds_dict = json.loads(os.environ['GCP_CREDENTIALS'])
          scope = ["https://www.googleapis.com/auth/spreadsheets"]
          creds = ServiceAccountCredentials.from_json_keyfile_dict(creds_dict, scope)
          client = gspread.authorize(creds)
          service = build('sheets', 'v4', credentials=creds)

          spreadsheet_id = "YOUR_SHEET_ID"
          spreadsheet = client.open_by_key(spreadsheet_id)

          for sheet_name in xls.sheet_names:
              df = pd.read_excel(xls, sheet_name=sheet_name)

              # Clean values for JSON compliance
              df = df.replace([np.inf, -np.inf], "")
              df = df.fillna("")
              df = df.astype(str)

              try:
                  ws = spreadsheet.worksheet(sheet_name)
              except:
                  ws = spreadsheet.add_worksheet(title=sheet_name, rows="1000", cols="20")
              ws.clear()
              ws.update([list(df.columns)] + df.values.tolist())

              # Build formatting requests
              requests = []

              # Header row formatting
              requests.append({
                  "repeatCell": {
                      "range": {"sheetId": ws.id, "startRowIndex": 0, "endRowIndex": 1},
                      "cell": {
                          "userEnteredFormat": {
                              "backgroundColor": {"red": 0.12, "green": 0.30, "blue": 0.79},
                              "textFormat": {"bold": True, "foregroundColor": {"red": 1, "green": 1, "blue": 1}}
                          }
                      },
                      "fields": "userEnteredFormat(backgroundColor,textFormat)"
                  }
              })

              # Row colouring based on SMA Signal
              if "SMA Signal" in df.columns:
                  for ri, val in enumerate(df["SMA Signal"], 1):
                      color = None
                      if "STRONG" in val:
                          color = {"red": 0.80, "green": 0.95, "blue": 0.80}  # light green
                      elif "GOOD" in val:
                          color = {"red": 0.90, "green": 0.98, "blue": 0.90}  # pale green
                      elif "OVERBOUGHT" in val:
                          color = {"red": 0.95, "green": 0.80, "blue": 0.80}  # light red
                      elif "BELOW" in val:
                          color = {"red": 0.98, "green": 0.90, "blue": 0.70}  # orange
                      if color:
                          requests.append({
                              "repeatCell": {
                                  "range": {"sheetId": ws.id, "startRowIndex": ri, "endRowIndex": ri+1},
                                  "cell": {"userEnteredFormat": {"backgroundColor": color}},
                                  "fields": "userEnteredFormat(backgroundColor)"
                              }
                          })

              if requests:
                  service.spreadsheets().batchUpdate(
                      spreadsheetId=spreadsheet_id,
                      body={"requests": requests}
                  ).execute()

          # Add How to Use sheet with teal headers
          try:
              ws = spreadsheet.worksheet("How to Use")
          except:
              ws = spreadsheet.add_worksheet(title="How to Use", rows="50", cols="5")
          ws.clear()
          guide = [
              ["DAILY ROUTINE", ""],
              ["India Step 1", "4:30 PM IST — GitHub auto-runs scanner"],
              ["India Step 2", "SMA filter runs automatically after scanner"],
              ["India Step 3", "Stock Picker runs automatically after SMA"],
              ["", ""],
              ["SMA CONDITION REMINDER", ""],
              ["Condition 1", "Price > SMA 50"],
              ["Condition 2", "Price > SMA 100"],
              ["Condition 3", "Price > SMA 200"],
              ["Condition 4", "Price <= SMA200 x 1.10 (not overbought)"],
              ["Sweet Spot", "0-5% above 200 SMA = STRONG"],
              ["Good Zone", "5-10% above 200 SMA = GOOD"]
          ]
          ws.update(guide)

          print("✅ Full SMA Filter workbook duplicated with colour indicators in Google Sheet")
          PYEOF
