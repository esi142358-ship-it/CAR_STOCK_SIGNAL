name: Daily Stock Signal Scanner

on:
  schedule:
    # Runs at 4:00 PM IST = 10:30 UTC, Monday to Friday
    - cron: '30 10 * * 1-5'
  workflow_dispatch:   # Allows manual trigger from GitHub UI anytime

jobs:
  scan-and-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set today's date
        id: date
        run: echo "date=$(date +'%d %B %Y')" >> $GITHUB_OUTPUT

      - name: Run stock scanner
        run: python stock_signal_scanner.py

      - name: Archive report in GitHub
        run: |
          mkdir -p reports
          DATED_FILE="reports/buy_signals_$(date +'%Y-%m-%d').xlsx"
          cp buy_signals_report.xlsx "$DATED_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$DATED_FILE"
          git commit -m "Report: $(date +'%d %B %Y')" || echo "Nothing to commit"
          git push

      - name: Send email with report
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_ADDRESS }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "NSE Buy Signals Report - ${{ steps.date.outputs.date }}"
          to: ${{ secrets.RECIPIENT_EMAIL }}
          from: NSE Scanner <${{ secrets.GMAIL_ADDRESS }}>
          body: |
            Hello,

            Please find attached today's NSE Buy Signals Report.

            Scan ran on: ${{ steps.date.outputs.date }}

            This is an automated email sent by your GitHub Actions stock scanner.

            Regards,
            NSE Scanner Bot
          attachments: buy_signals_report.xlsx
